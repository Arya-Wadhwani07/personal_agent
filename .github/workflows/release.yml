name: Approved Cloud Run Instance release
on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Reviewed Artifact Registry image including @sha256 digest
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-instance
  cancel-in-progress: false
jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce readiness, budget, and observation freeze
        env:
          A3_IMAGE: ${{ inputs.image_digest }}
          A3_GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          A3_REGION: ${{ vars.GCP_REGION }}
          A3_BUDGET_USD: ${{ vars.APPROVED_BUDGET_USD }}
        run: python scripts/deploy.py --plan
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Deploy reviewed immutable image to an Instance
        env:
          A3_IMAGE: ${{ inputs.image_digest }}
          A3_GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          A3_REGION: ${{ vars.GCP_REGION }}
          A3_BUDGET_USD: ${{ vars.APPROVED_BUDGET_USD }}
        run: python scripts/deploy.py --execute
