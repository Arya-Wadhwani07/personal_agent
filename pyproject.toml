[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment3-personal-agent"
version = "0.1.0"
description = "Isolated Hermes personal assistant with policy-enforced integrations"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.163,<1",
  "aiohttp==3.14.5",
  "google-auth-oauthlib>=1.2,<2",
  "uvicorn>=0.54,<1",
  "httpx[socks]==0.28.1",
  "pydantic==2.14.1",
  "google-cloud-storage>=3.17,<4",
  "hermes-agent[telegram]==0.0.0",
]
[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.5,<2", "pytest-cov>=7,<8", "ruff>=0.17,<1", "bandit>=1.9,<2", "pip-audit>=2.10,<3"]
[project.scripts]
personal-agent = "personal_agent.runtime:main"
[project.entry-points."hermes_agent.plugins"]
assignment3 = "personal_agent.plugin"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
personal_agent = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
[tool.ruff]
line-length = 100
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "S404"]
[tool.uv]
environments = ["sys_platform == 'linux' and python_version >= '3.14'"]
override-dependencies = ["psutil==7.2.2", "Pillow==13.0.0", "cryptography==50.0.2", "pynacl>=1.6,<1.7"]

[tool.uv.sources]
hermes-agent = { path = ".cache/vendor/hermes-agent-0.22.7", editable = true }
